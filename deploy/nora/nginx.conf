server {
  listen 80;
  server_name _;
  client_max_body_size 20m;

  resolver 127.0.0.11 ipv6=off valid=10s;

  location /api/ {
    set $api_upstream backend:3000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 1500s;
    proxy_send_timeout 1500s;
    # The host proxy in front of this container buffers a whole chat unless it
    # sees this header, so reasoning and the reply arrive as one finished block.
    add_header X-Accel-Buffering no always;
  }

  location = /health {
    set $api_upstream backend:3000;
    proxy_pass http://$api_upstream/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location ^~ /landing/ {
    root /usr/share/nginx/landing;
    try_files $uri =404;
  }

  location ^~ /fonts/ {
    root /usr/share/nginx/landing;
    try_files $uri =404;
  }

  location ^~ /_astro/ {
    root /usr/share/nginx/landing;
    try_files $uri =404;
  }

  location = /favicon.svg {
    root /usr/share/nginx/landing;
    try_files /favicon.svg =404;
  }

  location = /favicon.ico {
    root /usr/share/nginx/landing;
    try_files /favicon.ico =404;
  }

  location / {
    root /usr/share/nginx/app;
    try_files $uri $uri/ /index.html;
  }
}
